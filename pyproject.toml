[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt_prism"
version = "1.0.0"
description = "Universal framework for LLM Prompt Optimization using Fractional Factorial Design of Experiments (DoE) & ANOVA"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["prompt-engineering", "design-of-experiments", "doe", "fractional-factorial", "anova", "llm", "prompt-optimization"]
license = {text = "MIT"}
authors = [{name = "robsanmx"}]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas>=1.0.0",
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "statsmodels>=0.13.0",
    "pydantic>=2.0.0",
    "jinja2>=3.0.0",
    "tabulate>=0.8.0",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.3.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    # Floors match the versions CI pins: an older black or isort formats
    # differently and would fail the lint job after a clean local run.
    "black>=26.5.1",
    "isort>=9.0.0",
    "flake8>=7.0.0",
]
cloud = [
    "google-cloud-aiplatform>=1.0.0",
    "vertexai>=1.0.0",
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "litellm>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/robsanmx/prompt_prism"
Repository = "https://github.com/robsanmx/prompt_prism"
Issues = "https://github.com/robsanmx/prompt_prism/issues"

[project.scripts]
prompt-prism = "prompt_prism.cli.main:main"
prism = "prompt_prism.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["prompt_prism*"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=prompt_prism --cov-report=term-missing"
