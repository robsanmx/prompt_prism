name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Pinned: an unpinned formatter turns a new release into a red build.
      - run: pip install "black==26.5.1" "isort==9.0.1" "flake8==7.3.0"
      - run: black --check prompt_prism tests examples
      - run: isort --check-only prompt_prism tests examples
      - run: flake8 prompt_prism tests examples

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[viz,dev]"
      - run: pytest
