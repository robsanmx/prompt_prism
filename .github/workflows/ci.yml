name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,viz]"

      - name: Check code formatting (Black & isort)
        run: |
          black --check prompt_prism tests examples
          isort --check prompt_prism tests examples

      - name: Lint with Pyflakes & Flake8
        run: |
          pyflakes prompt_prism tests examples
          flake8 prompt_prism tests examples

      - name: Run Test Suite
        run: |
          pytest -v --cov=prompt_prism --cov-report=xml --cov-report=term

      - name: Smoke test examples
        run: |
          python examples/prompt_optimization_tutorial.py
          python examples/rag_prompt_optimization.py
